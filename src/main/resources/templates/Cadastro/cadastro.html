<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema Jurídico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary-teal: #3aa6a2; }
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .auth-row { display: flex; height: 100vh; }

        .auth-image-col {
            flex: 1;
            background-image: url("/img/fundo-login.png");
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .auth-image-col::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
        }

        .auth-form-col {
            flex: 0 0 450px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .form-control { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 12px; border-radius: 8px; }
        .form-control:focus { border-color: var(--primary-teal); box-shadow: none; background: #fff; }
        .btn-teal { background-color: var(--primary-teal); color: white; padding: 12px; font-weight: bold; border: none; transition: 0.3s; width: 100%; border-radius: 8px; }
        .btn-teal:hover { background-color: #2f8c88; color: white; }
        .btn-outline-secondary { border-radius: 8px; padding: 10px; width: 100%; }
    </style>
</head>
<body>
<div class="auth-row">
    <div class="auth-image-col"></div>
    <div class="auth-form-col">
        <div class="text-center mb-4">
            <div class="fs-1 text-secondary mb-2"><i class="bi bi-scales" style="color: var(--primary-teal);"></i></div>
            <h3 class="fw-bold">Cadastro de Usuário</h3>
            <p class="text-muted small">Crie seu usuário no sistema administrativo.</p>
        </div>

        <form method="post" th:action="@{/cadastro/processar}" th:object="${usuario}">
            <div class="mb-3">
                <label class="form-label small text-muted fw-bold">E-mail Corporativo</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="seuemail@exemplo.com" required autocomplete="email">
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted fw-bold">Telefone / Celular (Com DDD)</label>
                <input type="text" class="form-control" th:field="*{telefone}" placeholder="(00) 90000-0000" required autocomplete="tel">
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted fw-bold">Nome Completo</label>
                <input type="text" class="form-control" th:field="*{nome}" placeholder="Seu nome" required autocomplete="name">
            </div>

            <div class="mb-4">
                <label class="form-label small text-muted fw-bold">Senha de Acesso</label>
                <input type="password" class="form-control" th:field="*{senha}" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-teal mb-3">Cadastrar Administrador</button>
            <div class="small text-center mt-2">
                Já possui uma conta? <a th:href="@{/login}" style="color: var(--primary-teal); font-weight: bold; text-decoration: none;">Faça login</a>
            </div>
        </form>
    </div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
    <div id="alertaToast" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" th:if="${erro != null}">
        <div class="d-flex">
            <div class="toast-body"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${erro != null}">
    document.addEventListener("DOMContentLoaded", function() { new bootstrap.Toast(document.getElementById('alertaToast'), { delay: 4000 }).show(); });
</script>
</body>
</html>
