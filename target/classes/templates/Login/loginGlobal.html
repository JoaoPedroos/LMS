<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - LMS Jurídico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary-teal: #3aa6a2; }
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .auth-row { display: flex; height: 100vh; }

        .auth-image-col {
            flex: 1;
            position: relative;
            overflow: hidden; /* Garante que o vídeo não "escape" da div */
        }

        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover; /* Faz o vídeo preencher todo o espaço como um background-size: cover */
            z-index: 1;
        }

        /* Garante que o filtro escuro fique por cima do vídeo */
        .auth-image-col::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 2;
        }

        .auth-form-col {
            flex: 0 0 450px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .form-control { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 12px; border-radius: 8px; }
        .form-control:focus { border-color: var(--primary-teal); box-shadow: none; background: #fff; }
        .btn-teal { background-color: var(--primary-teal); color: white; padding: 12px; font-weight: bold; border: none; transition: 0.3s; width: 100%; border-radius: 8px; }
        .btn-teal:hover { background-color: #2f8c88; color: white; }
        .btn-outline-secondary { border-radius: 8px; padding: 10px; width: 100%; }
    </style>
</head>
<body>
<div class="auth-row">
    <div class="auth-image-col">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="/img/loop.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>
    <div class="auth-form-col">
        <div class="text-center mb-4">
            <div class="fs-1 text-secondary mb-2"><i class="bi bi-scales" style="color: var(--primary-teal);"></i></div>
            <h3 class="fw-bold">Acessar o Portal</h3>
            <p class="text-muted small">Insira seu e-mail para localizar seu escritório.</p>
        </div>

        <div th:if="${erro}" class="alert alert-danger py-2 small fw-bold text-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${erro}"></span>
        </div>

        <form th:action="@{/login/buscar-empresa}" method="post">
            <div class="mb-4">
                <label class="form-label small text-muted fw-bold">E-mail Corporativo</label>
                <input type="email" name="email" class="form-control" placeholder="seuemail@exemplo.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-teal mb-3">Continuar <i class="bi bi-arrow-right ms-1"></i></button>
            <a href="/cadastro" class="btn btn-outline-secondary">Criar uma conta</a>
        </form>
    </div>
</div>
</body>
</html>
