<form th:action="@{/{slug}/equipe/salvar-permissoes(slug=${slugEmpresa})}" method="post">
  <input type="hidden" name="usuarioId" th:value="${funcionario.id}">

  <h5 th:text="'Permissões para: ' + ${funcionario.nome}"></h5>

  <div class="row">
    <div class="col-md-4" th:each="p : ${todasPermissoes}">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" name="permissoesIds"
               th:value="${p.id}"
               th:checked="${funcionario.permissoes.contains(p)}">
        <label class="form-check-label" th:text="${p.descricao}"></label>
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-teal mt-3">Salvar Acessos</button>
</form>
