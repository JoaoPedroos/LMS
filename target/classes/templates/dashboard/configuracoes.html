<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{dashboard/fragments/shared :: head('Configurações - LMS Jurídico')}"></head>
<body>

<div th:replace="~{dashboard/fragments/shared :: sidebar}"></div>

<div class="main-content" id="mainContent">
    <div th:replace="~{dashboard/fragments/shared :: header}"></div>

    <div class="container-fluid p-4">
        <h3 class="fw-bold mb-4" style="color: #111827;">
            <i class="bi bi-gear text-teal me-2" style="color: var(--primary-teal);"></i> Parâmetros Globais do Escritório
        </h3>

        <div class="row g-4">

            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                        <h6 class="fw-bold text-dark mb-0">Estrutura Institucional</h6>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/{slug}/configuracoes/salvar-institucional(slug=${slugEmpresa})}" method="post">

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Nome Fantasia do Escritório</label>
                                <input type="text" name="nomeFantasia" class="form-control" th:value="${empresa.nome}" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">CNPJ da Sociedade</label>
                                <input type="text" id="cnpjInput" name="cnpj" class="form-control"
                                       th:value="${empresa.cnpj}" placeholder="00.000.000/0001-00" maxlength="18" required>
                            </div>

                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-link text-decoration-none text-dark fw-medium">
                                    Atualizar Cadastro Institucional
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-3 d-flex justify-content-between align-items-center">
                        <h6 class="fw-bold text-dark mb-0">Equipe de Operadores</h6>
                        <button class="btn btn-outline-dark btn-sm rounded-pill fw-medium px-3" data-bs-toggle="modal" data-bs-target="#modalNovoOperador">
                            <i class="bi bi-link-45deg me-1"></i> Link de Convite
                        </button>
                    </div>

                    <ul class="list-group list-group-flush border-top">
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3 border-bottom" th:each="operador : ${equipe}">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center fw-bold text-secondary me-3"
                                     style="width: 40px; height: 40px;" th:text="${#strings.substring(operador.nome, 0, 1)}">A</div>
                                <div>
                                    <div class="fw-bold text-dark mb-0" th:text="${operador.nome}">Administrador Principal</div>
                                    <div class="small text-muted" th:text="${operador.tipoUsuario != null ? operador.tipoUsuario.nome : 'Acesso Padrão'}">Acesso Irrestrito</div>
                                </div>
                            </div>
                            <div>
                                <span class="badge bg-dark rounded-pill px-3 py-2" th:if="${operador.tipoUsuario != null and operador.tipoUsuario.nome == 'ADMIN'}">Dono</span>
                                <span class="badge bg-light text-dark border rounded-pill px-3 py-2" th:if="${operador.tipoUsuario == null or operador.tipoUsuario.nome != 'ADMIN'}">Operador</span>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="modalNovoOperador" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Adicionar Operador</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/{slug}/configuracoes/operador/salvar(slug=${slugEmpresa})}" method="post">
                <div class="modal-body p-4">
                    <p class="small text-muted mb-4">Cadastre um novo funcionário para que ele tenha acesso ao sistema do escritório.</p>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nome Completo</label>
                        <input type="text" name="nome" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">E-mail de Acesso</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Senha Inicial</label>
                        <input type="password" name="senha" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-dark">Cadastrar Operador</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('cnpjInput').addEventListener('input', function (e) {
        var x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,3})(\d{0,3})(\d{0,4})(\d{0,2})/);
        e.target.value = !x[2] ? x[1] : x[1] + '.' + x[2] + (x[3] ? '.' + x[3] : '') + (x[4] ? '/' + x[4] : '') + (x[5] ? '-' + x[5] : '');
    });
</script>

<div th:replace="~{dashboard/fragments/shared :: scripts}"></div>
</body>
</html>
