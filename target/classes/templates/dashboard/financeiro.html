<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{dashboard/fragments/shared :: head('Financeiro - LMS Jurídico')}"></head>
<body>

<div th:replace="~{dashboard/fragments/shared :: sidebar}"></div>

<div class="main-content" id="mainContent">
    <div th:replace="~{dashboard/fragments/shared :: header}"></div>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0" style="color: #111827;">Fluxo de Caixa</h3>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoLancamento" style="background-color: var(--primary-teal); border: none;">
                <i class="bi bi-plus-lg me-1"></i> Novo Lançamento
            </button>
        </div>

        <div class="content-card p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 border-0">
                    <thead class="table-light text-muted small">
                    <tr>
                        <th class="ps-4 border-0">Descrição</th>
                        <th class="border-0">Tipo</th>
                        <th class="border-0">Vencimento</th>
                        <th class="border-0">Valor</th>
                        <th class="border-0">Status</th>
                        <th class="pe-4 border-0 text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="lancamento : ${lancamentos}">
                        <td class="ps-4 fw-medium text-dark" th:text="${lancamento.descricao}">Serviço</td>

                        <td>
                            <span class="badge bg-success" th:if="${lancamento.tipo == 'RECEITA' or lancamento.tipo == 'ENTRADA'}">Receita</span>
                            <span class="badge bg-danger" th:if="${lancamento.tipo == 'DESPESA' or lancamento.tipo == 'SAIDA' or lancamento.tipo == 'PAGAMENTO'}">Despesa</span>
                        </td>

                        <td class="text-muted small" th:text="${#temporals.format(lancamento.dataVencimento, 'dd/MM/yyyy')}">01/01/2026</td>

                        <td class="fw-bold" th:text="|R$ ${#numbers.formatDecimal(lancamento.valor, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</td>

                        <td>
                            <span class="badge bg-warning text-dark" th:if="${lancamento.status == 'PENDENTE'}">Pendente</span>
                            <span class="badge bg-primary" th:if="${lancamento.status == 'PAGO' or lancamento.status == 'CONCLUIDO'}">Pago</span>
                        </td>

                        <td class="pe-4 text-end">
                            <a th:if="${lancamento.status == 'PENDENTE'}"
                               th:href="@{/{slug}/financeiro/status/{id}(slug=${slugEmpresa}, id=${lancamento.id})}"
                               class="btn btn-sm btn-success">
                                <i class="bi bi-check-circle"></i> Dar Baixa
                            </a>

                            <a th:if="${lancamento.status == 'PAGO' or lancamento.status == 'CONCLUIDO'}"
                               th:href="@{/{slug}/financeiro/status/{id}(slug=${slugEmpresa}, id=${lancamento.id})}"
                               class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-arrow-counterclockwise"></i> Desfazer
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lancamentos)}">
                        <td colspan="6" class="text-center py-5 text-muted small">Nenhum lançamento financeiro encontrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNovoLancamento" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Novo Lançamento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/{slug}/financeiro/salvar(slug=${slugEmpresa})}" method="post">
                <div class="modal-body p-4">

                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label small fw-bold">Descrição</label>
                            <input type="text" name="descricao" class="form-control" required placeholder="Ex: Pagamento Processo X">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Tipo</label>
                            <select name="tipo" class="form-select" id="selectTipo" required>
                                <option value="RECEITA">Receita</option>
                                <option value="DESPESA">Despesa</option>
                            </select>
                        </div>
                    </div>

                    <div class="card bg-light border-0 mb-3" id="blocoHonorarios">
                        <div class="card-body py-2 px-3">
                            <div class="form-check form-switch mb-2 mt-1">
                                <input class="form-check-input" type="checkbox" id="checkHonorarios">
                                <label class="form-check-label small fw-bold text-primary">Calcular % de Honorários</label>
                            </div>
                            <div class="row g-2 d-none" id="camposHonorarios">
                                <div class="col-md-7">
                                    <label class="form-label small text-muted mb-1">Valor da Causa (R$)</label>
                                    <input type="number" step="0.01" id="valorCausa" class="form-control form-control-sm">
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label small text-muted mb-1">Porcentagem (%)</label>
                                    <input type="number" step="0.1" id="porcentagemHonorario" class="form-control form-control-sm" placeholder="Ex: 30">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Valor Final Recebido (R$)</label>
                            <input type="number" step="0.01" name="valor" id="valorFinal" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Vencimento</label>
                            <input type="date" name="dataVencimento" class="form-control" required>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Status</label>
                            <select name="status" class="form-select" required>
                                <option value="PENDENTE">Pendente</option>
                                <option value="PAGO">Pago</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Parcelas</label>
                            <input type="number" name="parcelas" value="1" min="1" class="form-control">
                        </div>
                    </div>

                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="background-color: var(--primary-teal); border: none;">Salvar Lançamento</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const checkHonorarios = document.getElementById('checkHonorarios');
        const camposHonorarios = document.getElementById('camposHonorarios');
        const valorCausa = document.getElementById('valorCausa');
        const porcentagemHonorario = document.getElementById('porcentagemHonorario');
        const valorFinal = document.getElementById('valorFinal');
        const selectTipo = document.getElementById('selectTipo');
        const blocoHonorarios = document.getElementById('blocoHonorarios');

        // Esconde o bloco de honorários se for uma despesa
        selectTipo.addEventListener('change', function() {
            if(this.value === 'DESPESA') {
                blocoHonorarios.style.display = 'none';
                checkHonorarios.checked = false;
                camposHonorarios.classList.add('d-none');
                valorFinal.removeAttribute('readonly');
            } else {
                blocoHonorarios.style.display = 'block';
            }
        });

        // Mostra/Esconde os campos de cálculo
        checkHonorarios.addEventListener('change', function() {
            if(this.checked) {
                camposHonorarios.classList.remove('d-none');
                valorFinal.setAttribute('readonly', true); // Bloqueia digitação manual para garantir a matemática
            } else {
                camposHonorarios.classList.add('d-none');
                valorFinal.removeAttribute('readonly');
            }
        });

        // Extrai a % do valor cheio da causa
        function calcularHonorarios() {
            if(checkHonorarios.checked) {
                let vCausa = parseFloat(valorCausa.value) || 0;
                let pCausa = parseFloat(porcentagemHonorario.value) || 0;
                let resultado = vCausa * (pCausa / 100);
                valorFinal.value = resultado.toFixed(2);
            }
        }

        valorCausa.addEventListener('input', calcularHonorarios);
        porcentagemHonorario.addEventListener('input', calcularHonorarios);
    });
</script>

<div th:replace="~{dashboard/fragments/shared :: scripts}"></div>
</body>
</html>
